name: Release

# 推送 v* 标签（如 v0.1.0）时构建并发布：
#   - ZhaoZhao-full-<版本>.zip     完整版便携包（含 LibreOffice 和 OCR 组件，离线可用）
#   - ZhaoZhao-setup-<版本>.exe    完整版离线安装包
#   - ZhaoZhao-portable-<版本>.zip 精简版（只有主程序，组件需自行放入 components\）
# 完整版在真实 Windows 上做过冒烟测试（老格式转换、图片 OCR、压缩包）才会产出。

on:
  push:
    tags: ["v*"]
  # 手动触发：在 Actions 页面点 Run workflow，填写版本标签（如 v0.1.0）。
  # 发布时由 GitHub 在所选提交上创建这个标签，不需要本地推送标签。
  workflow_dispatch:
    inputs:
      version:
        description: 发布的版本标签，如 v0.1.0
        required: true
        default: v0.1.0

permissions:
  contents: write

jobs:
  full:
    uses: ./.github/workflows/bundle.yml
    with:
      version: ${{ inputs.version || github.ref_name }}

  lite:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: go test ./...
      - run: packaging/build-windows.sh dist
      - uses: actions/upload-artifact@v4
        with:
          name: lite
          path: dist/ZhaoZhao-portable-*.zip
          retention-days: 7

  publish:
    # 下载 CHANGELOG.md 需要代码
    if: github.ref_type == 'tag' || inputs.version != ''
    needs: [full, lite]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - run: find artifacts -type f -printf '%p  %s\n'
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.version || github.ref_name }}
          target_commitish: ${{ github.sha }}
          name: 找找 ${{ inputs.version || github.ref_name }}
          body_path: CHANGELOG.md
          generate_release_notes: false
          files: |
            artifacts/full/ZhaoZhao-full-*.zip
            artifacts/full/ZhaoZhao-setup-*.exe
            artifacts/lite/ZhaoZhao-portable-*.zip
